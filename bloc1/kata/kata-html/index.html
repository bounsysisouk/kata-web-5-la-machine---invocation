<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata Web4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulaire de contact</h1>
    </header>

    <main>
        <section>
            <h2>Nous contacter</h2>

            <!-- Destination à définir lorsqu'un serveur de traitement sera disponible -->
            <form action="" method="post">
                <div class="form-group">
                    <label for="name">Nom :</label>
                    <input type="text" id="name" name="Nom_utilisateur" required/>
                </div> 
                <div class="form-group"> 
                    <label for="mail">E-mail :</label>
                    <input type="email" id="mail" name="Adresse_email" required/>
                </div>
                <div class="form-group">    
                    <label for="select">Motif de contact</label>
                    <select name="Motif_de_contact" id="select" required>
                        <option value="Demande d'information">Demande d'information</option>
                        <option value="Réclamation">Réclamation</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="msg">Message</label>
                    <textarea name="Message_utilisateur" id="msg" required></textarea>
                </div>
                <button type="submit">Envoyer message</button>
            </form>
        </section>
    </main>
</body>
<footer>
    <p>&copy; 2026 Bounsy Sisouk</p>
</footer>
</html>
